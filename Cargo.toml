[package]
name = "toolsync"
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
description = "Keep personal Rust tools synced across machines"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/toolsync"

[[bin]]
name = "tsync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false }
dirs = "7"
indicatif = "0.18.6"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
