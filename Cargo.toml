[package]
name = "toolsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Keep personal Rust tools synced across machines"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/toolsync"

[[bin]]
name = "toolsync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
